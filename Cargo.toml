[package]
name = "video-player"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
gpui = "0.2.2"
libmpv2 = { version = "7.0.0", default-features = false }
raw-window-handle = "0.6"
regex = "1.13.1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-segmentation = "1.13.3"
ureq = { version = "3", features = ["json"] }
walkdir = "2.5.0"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.27.0"
