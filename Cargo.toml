[package]
name = "video-player"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
keyring = "4.2"
gpui = "0.2.2"
libmpv2 = { version = "7.0.0", default-features = false }
raw-window-handle = "0.6"
regex = "1.13.1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-segmentation = "1.13.3"
ureq = { version = "3", features = ["json"] }
walkdir = "2.5.0"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
futures = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Foundation", "Media", "Storage", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_WinRT", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
libmpv2-sys = "4.0.1"
objc = "0.2"
souvlaki = { version = "0.9.3", default-features = false }

[build-dependencies]
embed-resource = "3.0.12"
# Fetching libmpv (build/libmpv.rs).
cc = "1.11.1"
flate2 = "1.1.11"
object = { version = "0.39.1", default-features = false, features = ["read", "std"] }
sha2 = "0.10.9"
tar = "0.4.46"
ureq = "3.5.1"
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = "3.27.0"

# GPUI with smoother text on Windows (see third_party/gpui/PATCHES.md).
[patch.crates-io]
gpui = { path = "third_party/gpui" }
