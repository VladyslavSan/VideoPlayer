# Release notes from commit messages (git-cliff), used by release.yml.
# Grouped by type; commits from before Conventional Commits go under "Other".

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**Breaking:** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/VladyslavSan/VideoPlayer/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Older commits aren't conventional; keep them, under "Other".
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# The HTML comments order the groups and are stripped from the headings.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->New" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Faster" },
  { message = "^revert", group = "<!-- 3 -->Reverted" },
  { message = "^(refactor|test|docs|build|ci|chore)", skip = true },
  { message = "^(Merge|fixup!|squash!|amend!)", skip = true },
  { message = ".*", group = "<!-- 4 -->Other" },
]
