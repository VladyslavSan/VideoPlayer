# Pushing a tag like v1.2.3 builds the Windows and macOS apps, runs the
# tests on both, and publishes a GitHub release with the two downloads.
# The tag sets the version (Cargo.toml's is replaced during the build).
# Running it by hand (Actions > Release > Run workflow) builds and tests
# without publishing; the downloads are kept as workflow artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: bash scripts/ci-version.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch libmpv
        shell: bash
        run: bash scripts/fetch-libmpv.sh
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $name = "VideoPlayer-$env:VERSION-windows-x64"
          New-Item -ItemType Directory "dist/$name" | Out-Null
          Copy-Item target/release/video-player.exe, target/release/libmpv-2.dll "dist/$name"
          Compress-Archive "dist/$name" "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: bash scripts/ci-version.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Metal compiler
        # GPUI compiles its shaders with Xcode's Metal compiler, which newer
        # Xcode versions download separately.
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Fetch libmpv
        run: bash scripts/fetch-libmpv-macos.sh
      - name: Test
        run: cargo test --release --target aarch64-apple-darwin
      - name: Build and bundle
        run: bash scripts/bundle-macos.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/bundle/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Video Player ${GITHUB_REF_NAME#v}" \
            --generate-notes
